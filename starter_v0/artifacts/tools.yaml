# Research Agent tool interface — v3 candidate.
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Tạm dừng để hỏi người dùng khi thiếu argument bắt buộc, hoặc xin xác nhận yes/no trước hành động gửi/đăng. Không dùng nếu có thể trả lời trực tiếp."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Câu hỏi"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Kiểu trả lời"}
        options: {type: array, default: [], items: {type: string}, description: "Các lựa chọn"}
      required: [question]

  - name: timeline
    description: "Lấy bài đăng gần đây CỦA đúng một tài khoản. Dùng cho tác giả/account cụ thể; không dùng để tìm bài VỀ một chủ đề. screenname không có @."
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Tên tài khoản"}
        limit: {type: integer, default: 5, description: "Số lượng"}
      required: [screenname]

  - name: social_search
    description: "Tìm bài đăng VỀ từ khóa/chủ đề trên mạng xã hội. Không dùng khi user hỏi bài CỦA một account cụ thể. Top=phổ biến, Latest=mới nhất."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Cách sắp xếp"}
        limit: {type: integer, default: 5, description: "Số lượng"}
      required: [query]

  - name: lookup
    description: "Tìm tin tức hoặc thông tin trên web. Với tin dùng topic=news và map hôm nay/day, tuần/week, tháng/month, năm/year. Không dùng khi user đã cung cấp URL cần đọc."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn"}
        topic: {type: string, enum: [general, news], default: "general", description: "Phân loại"}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "Khoảng thời gian"}
        max_results: {type: integer, default: 5, description: "Số kết quả"}
      required: [query]

  - name: fetch
    description: "Đọc nội dung từ chính xác một URL đã được user cung cấp. Nếu user nói 'bài này' nhưng thiếu URL, gọi clarify thay vì đoán."
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "Địa chỉ"}
      required: [url]

  - name: format
    description: "Chỉ định dạng danh sách items đã thu thập thành markdown; không tìm kiếm và không đọc URL. Thường gọi sau tool research."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách item"
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Khuôn"}
        headline: {type: string, default: "", description: "Tiêu đề"}
      required: [items, template]

  # ---------------- Bonus tools ----------------
  - name: send
    description: "Gửi text lên Telegram, có side effect. Chỉ gọi với confirmed=true sau khi user đã xác nhận rõ; nếu chưa xác nhận phải gọi clarify yes_no."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Nội dung"}
        confirmed: {type: boolean, default: false, description: "Cờ xác nhận"}
      required: [text]

  - name: discord_send
    description: "Gửi plain text lên Discord qua webhook, có side effect. Chỉ gọi với confirmed=true sau khi user xác nhận rõ nội dung và đích Discord; nếu chưa xác nhận phải gọi clarify yes_no."
    parameters:
      type: object
      properties:
        text: {type: string, minLength: 1, maxLength: 2000, description: "Nội dung plain text gửi lên Discord"}
        confirmed: {type: boolean, default: false, description: "True chỉ sau khi user đã xác nhận gửi"}
      required: [text, confirmed]

  - name: policy
    description: "Tìm câu trả lời trong company policy nội bộ. Chỉ dùng cho câu hỏi chính sách công ty, không dùng cho web research."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn"}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Nhóm"}
        top_k: {type: integer, default: 3, description: "Số mục"}
      required: [query]

  - name: papers
    description: "Tìm metadata paper trên arXiv theo chủ đề. Không dùng cho tin web chung hoặc khi đã có arXiv ID cần đọc."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        max_results: {type: integer, default: 5, description: "Số lượng"}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Sắp xếp"}
      required: [query]

  - name: paper_text
    description: "Tải và trích text của paper khi đã có arXiv ID/URL. Không dùng để tìm paper theo chủ đề."
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "ID hoặc địa chỉ"}
        max_pages: {type: integer, default: 5, description: "Số trang"}
        max_chars: {type: integer, default: 8000, description: "Số ký tự"}
      required: [arxiv_url]

  - name: citation_audit
    description: "Kiểm tra danh sách nguồn user đã cung cấp có URL hợp lệ, tiêu đề và nguồn hay chưa; phát hiện URL trùng. Không tìm kiếm, không xác minh tính đúng của nội dung."
    parameters:
      type: object
      properties:
        items:
          type: array
          description: "Danh sách nguồn cần audit"
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
            required: [url]
        require_https: {type: boolean, default: true, description: "Yêu cầu URL HTTPS"}
      required: [items]
